    <main class="contenedor-form-guia">
    <form id="form-guia">
      <!-- 1. Select de Juego con lupa -->
      <div class="campo-form">
        <label for="juego">Juego</label>
        <div class="select-con-icono">
          <i class="lupa">🔍</i>
          <select name="juego" id="juego" required>
            <option value="" disabled selected>Selecciona un juego</option>
            <option value="fortnite">Fortnite</option>
            <option value="minecraft">Minecraft</option>
            <option value="lol">League of Legends</option>
            <option value="valorant">Valorant</option>
          </select>
        </div>
      </div>

      <!-- 2. Título de la guía -->
      <div class="campo-form">
        <label for="titulo">Título de la Guía</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ej: Cómo subir de rango rápido" required>
      </div>

      <!-- 3. Cuerpo de la guía -->
      <div class="campo-form">
        <label for="cuerpo">Cuerpo de la Guía</label>
        <textarea id="cuerpo" name="cuerpo" placeholder="Escribe aquí tu guía paso a paso..." rows="10" required></textarea>
      </div>

      <!-- 4. Botón para agregar imágenes -->
      <div class="campo-form">
        <button type="button" class="btn-imagen">+ Agregar Imágenes</button>
      </div>

      <!-- 5. Botón Publicar -->
      <button type="submit" class="btn-publicar">Publicar Guía</button>
    </form>
  </main>
